name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hermetic-gates:
    name: Hermetic Quality & Unit Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: ESLint check
        run: npx eslint src scripts --max-warnings 0

      - name: OpenAPI route coverage gate
        run: node scripts/api/route-coverage.mjs

      - name: Domain unit test suites (8 modules)
        run: |
          node scripts/api/t-admin-unit.mjs
          node scripts/api/t-cart-unit.mjs
          node scripts/api/t-catalog-unit.mjs
          node scripts/api/t-customers-unit.mjs
          node scripts/api/t-inventory-unit.mjs
          node scripts/api/t-orders-unit.mjs
          node scripts/api/t-promotions-unit.mjs
          node scripts/api/t-replacements-unit.mjs

      - name: Vitest unit & component tests
        run: npx vitest run

      - name: PGlite SQL schema & constraint tests
        run: |
          npm --prefix db/tests ci
          node db/tests/run-tests.js
          node db/tests/run-phase4-tests.js
          node db/tests/run-phase5-tests.js

      - name: Next.js production build
        run: npx next build --webpack

  postgres-integration:
    name: PostgreSQL 16 Live Schema & API Verification
    runs-on: ubuntu-latest
    needs: hermetic-gates
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: hyper_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci_password@localhost:5432/hyper_ci_test
      REG_RATE_LIMIT_PHONE_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Apply shipped SQL schemas (Phases 1-5 + Customer Auth + Guest Orders)
        run: |
          PGPASSWORD=ci_password psql -h localhost -U postgres -d hyper_ci_test -v ON_ERROR_STOP=1 -f db/phase1-schema.sql
          PGPASSWORD=ci_password psql -h localhost -U postgres -d hyper_ci_test -v ON_ERROR_STOP=1 -f db/phase1-seed-example.sql
          PGPASSWORD=ci_password psql -h localhost -U postgres -d hyper_ci_test -v ON_ERROR_STOP=1 -f db/phase2-schema.sql
          PGPASSWORD=ci_password psql -h localhost -U postgres -d hyper_ci_test -v ON_ERROR_STOP=1 -f db/phase2-seed-example.sql
          PGPASSWORD=ci_password psql -h localhost -U postgres -d hyper_ci_test -v ON_ERROR_STOP=1 -f db/phase3-schema.sql
          PGPASSWORD=ci_password psql -h localhost -U postgres -d hyper_ci_test -v ON_ERROR_STOP=1 -f db/phase3-seed-example.sql
          PGPASSWORD=ci_password psql -h localhost -U postgres -d hyper_ci_test -v ON_ERROR_STOP=1 -f db/phase4-schema.sql
          PGPASSWORD=ci_password psql -h localhost -U postgres -d hyper_ci_test -v ON_ERROR_STOP=1 -f db/phase4-seed-example.sql
          PGPASSWORD=ci_password psql -h localhost -U postgres -d hyper_ci_test -v ON_ERROR_STOP=1 -f db/phase5-schema.sql
          PGPASSWORD=ci_password psql -h localhost -U postgres -d hyper_ci_test -v ON_ERROR_STOP=1 -f db/phase5-seed-example.sql
          PGPASSWORD=ci_password psql -h localhost -U postgres -d hyper_ci_test -v ON_ERROR_STOP=1 -f db/phase5-auth-sessions.sql
          PGPASSWORD=ci_password psql -h localhost -U postgres -d hyper_ci_test -v ON_ERROR_STOP=1 -f db/phase2_5-customer-auth.sql
          PGPASSWORD=ci_password psql -h localhost -U postgres -d hyper_ci_test -v ON_ERROR_STOP=1 -f db/phase-bggo-guest-orders.sql

      - name: Verify Prisma schema & client generation against live PostgreSQL
        run: npx prisma generate
