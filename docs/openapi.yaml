# Hyper Al-Moatasem — Backend API contract (OpenAPI 3.0, BA-A).
#
# Machine-readable companion to docs/backend-application-contract.md.
# Conventions (normative, mirror the implementation):
# - success: { data, meta } (201 on creation, 200 otherwise; session
#   DELETE returns 200 + { data: { revoked: true } });
# - errors: { error: { code, message, details } } with stable codes
#   VALIDATION|UNAUTHENTICATED|FORBIDDEN|NOT_FOUND|CONFLICT|BUSINESS_RULE|
#   RATE_LIMITED|INTERNAL mapped to 400|401|403|404|409|422|429|500;
# - money/quantity/percent: decimal STRINGS (never float); timestamps:
#   ISO-8601 UTC strings; ids: UUIDs; pagination: limit (1..100, def 20)
#   + cursor (uuid, null at end) via nextCursor;
# - admin auth: __Host-admin-session cookie + per-permission checks
#   (x-permission below); store carts: x-guest-token XOR customerId;
# - order creation: Idempotency-Key header and/or body idempotencyKey
#   (header wins ties; both-different → 400; neither → 400).
# Validation strategy: scripts/api/t-ba-a-contract.mjs asserts bidirectional
# coverage between this file's paths and src/app/api/**/route.ts, plus live
# envelope/status/validation spot-checks. Keep both sides in sync.
# BA-B: list cursors are OPAQUE keyset tokens (base64url {v:1,s,id});
# raw UUIDs are rejected (400). Search cursors are v:2 {t,s,id}. Product
# detail adds description; gallery lives on dedicated media endpoints.
openapi: 3.0.3
info:
  title: Hyper Al-Moatasem Backend API
  version: 1.0.0
  description: Store + admin backend contract (BA-A canonical envelopes).
servers:
  - url: http://localhost:3131
    description: Local scratch verification server.
tags:
  - name: infra
  - name: store-catalog
  - name: store-inventory
  - name: store-customers
  - name: store-cart
  - name: store-orders
  - name: admin-catalog
  - name: admin-inventory
  - name: admin-customers
  - name: admin-orders
  - name: admin-replacements
  - name: admin-promotions
  - name: admin-coupons
  - name: admin-users
  - name: admin-roles
  - name: admin-permissions
  - name: admin-settings
  - name: admin-audit
  - name: admin-session
components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: __Host-admin-session
    guestToken:
      type: apiKey
      in: header
      name: x-guest-token
  headers:
    Idempotency-Key:
      description: Opaque client-generated key (1..64 chars, no spaces). Header wins ties with body idempotencyKey.
      schema:
        $ref: '#/components/schemas/IdempotencyKey'
  parameters:
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdPath:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    VariantIdPath:
      name: variantId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    GuestTokenHeaderOpt:
      name: x-guest-token
      in: header
      description: 64-hex guest bearer (absent when customerId identifies the owner).
      schema:
        type: string
    GuestTokenHeaderReq:
      name: x-guest-token
      in: header
      required: true
      description: 64-hex guest bearer proving cart ownership.
      schema:
        type: string
    IdempotencyKeyHeaderOpt:
      name: idempotency-key
      in: header
      description: Canonical idempotency key (alternative to body idempotencyKey).
      schema:
        $ref: '#/components/schemas/IdempotencyKey'
  schemas:
    UUID:
      type: string
      format: uuid
    DecimalString:
      type: string
      description: Exact decimal (money/quantity/percent). Never float.
      example: '15.00'
    DateTime:
      type: string
      format: date-time
      description: ISO-8601 UTC instant.
      example: '2026-09-29T18:00:00.000Z'
    IdempotencyKey:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^\S+$
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [VALIDATION, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT, BUSINESS_RULE, RATE_LIMITED, INTERNAL]
            message:
              type: string
            details:
              type: object
              nullable: true
    SuccessEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          description: Resource payload (object, array, or null by endpoint).
        meta:
          type: object
          description: Paging ({ limit, nextCursor }) and flags ({ replay }).
    PageMeta:
      type: object
      required: [limit, nextCursor]
      properties:
        limit:
          type: integer
        nextCursor:
          type: string
          format: uuid
          nullable: true
    PaginationQuery:
      type: object
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        cursor:
          $ref: '#/components/schemas/UUID'
paths:
  /api/health:
    get:
      tags: [infra]
      summary: Liveness + DB-readiness probe (public; single SELECT 1; sanitized 500 on DB failure; never writes).
      responses:
        '200':
          description: '{ data: { status: "ok", database: "ok" }, meta: {} }.'
        '500':
          description: Sanitized INTERNAL error (no driver text, no connection details).
  # ---------------- store: catalog (public reads) ----------------
  /api/store/catalog/brands:
    get:
      tags: [store-catalog]
      summary: List active brands.
      parameters:
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Brand page ({ data, meta }).
  /api/store/catalog/brands/{id}:
    get:
      tags: [store-catalog]
      summary: Get one active brand.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: Brand. }
        '404': { description: Unknown id. }
  /api/store/catalog/categories:
    get:
      tags: [store-catalog]
      summary: List active categories.
      responses:
        '200': { description: Category page ({ data, meta }). }
  /api/store/catalog/categories/{id}:
    get:
      tags: [store-catalog]
      summary: Get one active category.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: Category. }
        '404': { description: Unknown id. }
  /api/store/catalog/codes/lookup:
    get:
      tags: [store-catalog]
      summary: Resolve a barcode/internal code to its variant.
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Variant match. }
        '404': { description: Unknown code. }
  /api/store/catalog/products:
    get:
      tags: [store-catalog]
      summary: List active products (keyset pages; filters: search/category-subtree/brand/type/price-window/inStock; OOS stays listed).
      responses:
        '200': { description: Product page ({ data, meta }). }
  /api/store/catalog/products/{id}:
    get:
      tags: [store-catalog]
      summary: Get one active product (detail shape: list fields + description; variants/stock/gallery via dedicated endpoints).
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: Product detail. }
        '404': { description: Unknown id. }
  /api/store/catalog/search:
    get:
      tags: [store-catalog]
      summary: Product text search (pg_trgm + Arabic normalization; exact-code pin tier 4; tiers exact/prefix/similarity/brand-category; keyset pages).
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 120 }
        - $ref: '#/components/parameters/LimitParam'
        - name: cursor
          in: query
          description: Opaque search keyset token (v:2).
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [relevance, newest], default: relevance }
        - name: category
          in: query
          description: Subtree filter (category + descendants).
          schema: { $ref: '#/components/schemas/UUID' }
        - name: brand
          in: query
          schema: { $ref: '#/components/schemas/UUID' }
        - name: minPrice
          in: query
          schema: { $ref: '#/components/schemas/DecimalString' }
        - name: maxPrice
          in: query
          schema: { $ref: '#/components/schemas/DecimalString' }
        - name: inStock
          in: query
          schema: { type: string, enum: ['true', 'false'] }
      responses:
        '200': { description: '{ data: { query, results: [{...product, match: { kind, tier, score } }] } }.' }
        '400': { description: Empty/short query, bad cursor, bad window. }
  /api/store/catalog/products/{id}/images:
    get:
      tags: [store-catalog]
      summary: Product gallery (primary ?? first ?? null; empty array when none).
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: '{ data: { primary, gallery } }.' }
        '404': { description: Unknown product. }
  /api/store/catalog/products/{id}/variants:
    get:
      tags: [store-catalog]
      summary: List a product's active variants.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: Variant list. }
  /api/store/catalog/variants/{id}:
    get:
      tags: [store-catalog]
      summary: Get one active variant (live price basis).
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: Variant. }
        '404': { description: Unknown id. }
  # ---------------- store: inventory (public reads) ----------------
  /api/store/inventory/products/{id}:
    get:
      tags: [store-inventory]
      summary: Stock status for a product's variants.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: Stock rows (quantity/reserved/available decimal strings). }
  /api/store/inventory/variants/{id}:
    get:
      tags: [store-inventory]
      summary: Stock status for one variant.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { description: Stock row. }
        '404': { description: Unknown variant. }
  # ---------------- store: customers ----------------
  /api/store/customers/identify:
    post:
      tags: [store-customers]
      summary: Guest get-or-create by phone (canonical 201XXXXXXXXX; concurrent creators converge).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, firstName]
              properties:
                phone: { type: string, description: Any ladder form (010…/+2010…/002010…/2010…). }
                firstName: { type: string }
                lastName: { type: string, nullable: true }
      responses:
        '200': { description: Existing customer. }
        '201': { description: Created customer. }
        '422': { description: Invalid phone (frozen R8 ladder). }
  # ---------------- store: cart ----------------
  /api/store/cart:
    post:
      tags: [store-cart]
      summary: Mint guest cart (neither side) → 201 + guestToken; resolve existing → 200.
      parameters:
        - $ref: '#/components/parameters/GuestTokenHeaderOpt'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                customerId: { $ref: '#/components/schemas/UUID' }
      responses:
        '200': { description: Existing ACTIVE cart. }
        '201': { description: Created cart (+guestToken when guest). }
        '400': { description: Both/neither identity sides, or malformed token. }
    get:
      tags: [store-cart]
      summary: Read the owner's ACTIVE cart (expired → 404).
      parameters:
        - $ref: '#/components/parameters/GuestTokenHeaderOpt'
        - name: customerId
          in: query
          schema: { $ref: '#/components/schemas/UUID' }
      responses:
        '200': { description: Cart with lines. }
        '400': { description: Both/neither identity sides. }
        '404': { description: No ACTIVE cart (incl. expired). }
  /api/store/cart/items:
    post:
      tags: [store-cart]
      summary: Add a line (re-add aggregates at live price).
      parameters:
        - $ref: '#/components/parameters/GuestTokenHeaderOpt'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productVariantId, quantity]
              properties:
                customerId: { $ref: '#/components/schemas/UUID' }
                productVariantId: { $ref: '#/components/schemas/UUID' }
                quantity: { $ref: '#/components/schemas/DecimalString' }
      responses:
        '200': { description: Updated cart. }
        '400': { description: Ownership/shape violation. }
        '404': { description: No ACTIVE cart or unknown variant. }
        '422': { description: Step/unit/price rule violation. }
    delete:
      tags: [store-cart]
      summary: Clear all lines (draft maintenance; cart row stays ACTIVE).
      parameters:
        - $ref: '#/components/parameters/GuestTokenHeaderOpt'
        - name: customerId
          in: query
          schema: { $ref: '#/components/schemas/UUID' }
      responses:
        '200': { description: Emptied cart. }
        '404': { description: No ACTIVE cart. }
  /api/store/cart/items/{variantId}:
    patch:
      tags: [store-cart]
      summary: Set a line quantity (last-writer-wins).
      parameters:
        - $ref: '#/components/parameters/GuestTokenHeaderOpt'
        - $ref: '#/components/parameters/VariantIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                customerId: { $ref: '#/components/schemas/UUID' }
                quantity: { $ref: '#/components/schemas/DecimalString' }
      responses:
        '200': { description: Updated cart. }
        '404': { description: No ACTIVE cart or missing line. }
    delete:
      tags: [store-cart]
      summary: Remove one line.
      parameters:
        - $ref: '#/components/parameters/GuestTokenHeaderOpt'
        - $ref: '#/components/parameters/VariantIdPath'
        - name: customerId
          in: query
          schema: { $ref: '#/components/schemas/UUID' }
      responses:
        '200': { description: Updated cart. }
        '404': { description: No ACTIVE cart or missing line. }
  /api/store/cart/merge:
    post:
      tags: [store-cart]
      summary: Bind a guest cart to a customer (reassign or per-line sum + live reprice; dead lines reported).
      parameters:
        - $ref: '#/components/parameters/GuestTokenHeaderReq'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId]
              properties:
                customerId: { $ref: '#/components/schemas/UUID' }
      responses:
        '200': { description: Merge report { mode, inserted, summed, dropped }. }
        '404': { description: Unknown guest cart. }
        '409': { description: Guest cart consumed. }
  /api/store/cart/reprice:
    post:
      tags: [store-cart]
      summary: >-
        Persisted server-side reprice: refresh every line snapshot to the LIVE
        variant price and drop lines whose variant/product became inactive.
        Quantities untouched; no inventory, promotion or coupon state touched.
      parameters:
        - $ref: '#/components/parameters/GuestTokenHeaderOpt'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                customerId: { $ref: '#/components/schemas/UUID' }
      responses:
        '200':
          description: >-
            { cart, reprice: { repriced: integer, dropped: [{ lineId, variantId }] } }.
        '400': { description: Ownership XOR violation, or unknown body field (strict). }
        '404': { description: No ACTIVE cart (unknown / foreign / expired / consumed). }
  # ---------------- store: orders ----------------
  /api/store/orders:
    post:
      tags: [store-orders]
      summary: Create an order from the ACTIVE cart (one tx: reserve + snapshots + history + CHECKED_OUT). Replay → 200 + meta.replay.
      parameters:
        - $ref: '#/components/parameters/GuestTokenHeaderOpt'
        - $ref: '#/components/parameters/IdempotencyKeyHeaderOpt'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, addressId]
              properties:
                customerId: { $ref: '#/components/schemas/UUID' }
                addressId: { $ref: '#/components/schemas/UUID' }
                idempotencyKey: { $ref: '#/components/schemas/IdempotencyKey' }
                couponCode: { type: string, nullable: true }
      responses:
        '201': { description: Created order (snapshots frozen). }
        '200': { description: Idempotent replay (meta.replay true). }
        '400': { description: Conflicting idempotency keys (header vs body) or neither supplied. }
        '404': { description: No ACTIVE cart / customer / address. }
        '409': { description: Key used with different terms; stock short; price drift (new key needed). }
        '422': { description: Empty cart, unsellable variant, coupon invalid. }
    get:
      tags: [store-orders]
      summary: Own-order history (customerId-scoped).
      parameters:
        - name: customerId
          in: query
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200': { description: Order page. }
  /api/store/orders/estimate:
    post:
      tags: [store-orders]
      summary: Dry-run pricing (no locks, no rows, no reservation).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, addressId]
              properties:
                customerId: { $ref: '#/components/schemas/UUID' }
                addressId: { $ref: '#/components/schemas/UUID' }
                couponCode: { type: string, nullable: true }
      responses:
        '200': { description: Estimate (base/discount/net, integer money). }
  /api/store/orders/{id}:
    get:
      tags: [store-orders]
      summary: Own order detail (ownership-checked, else 404).
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: customerId
          in: query
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
      responses:
        '200': { description: Order with snapshot lines + history. }
        '404': { description: Unknown or foreign order. }
  /api/store/orders/{id}/cancel:
    post:
      tags: [store-orders]
      summary: Customer cancel (unpicked states only; releases holds, no movements).
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId]
              properties:
                customerId: { $ref: '#/components/schemas/UUID' }
      responses:
        '200': { description: CANCELLED order. }
        '404': { description: Unknown or foreign order. }
        '409': { description: Picked/further state. }
  /api/store/orders/{id}/replacements:
    get:
      tags: [store-orders]
      summary: List an order's replacement proposals (ownership-checked).
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: customerId
          in: query
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
      responses:
        '200': { description: Proposal list. }
        '404': { description: Unknown or foreign order. }
  /api/store/orders/{id}/replacements/{replacementId}/decide:
    post:
      tags: [store-orders]
      summary: Customer approve/reject (approve runs R10 materialization).
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: replacementId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, action]
              properties:
                customerId: { $ref: '#/components/schemas/UUID' }
                action: { type: string, enum: [approve, reject] }
      responses:
        '200': { description: Decided proposal. }
        '404': { description: Unknown/foreign proposal. }
        '409': { description: No longer PROPOSED, or substitute short. }
  # ---------------- admin: catalog (products.*) ----------------
  /api/admin/catalog/brands:
    get:
      tags: [admin-catalog]
      x-permission: products.view
      summary: List brands.
      responses: { '200': { description: Brand page. } }
    post:
      tags: [admin-catalog]
      x-permission: products.create
      summary: Create brand.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                slug: { type: string, nullable: true }
      responses:
        '201': { description: Created brand. }
        '409': { description: Duplicate slug/name. }
  /api/admin/catalog/brands/{id}:
    get:
      tags: [admin-catalog]
      x-permission: products.view
      summary: Get one brand.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses: { '200': { description: Brand. }, '404': { description: Unknown id. } }
    patch:
      tags: [admin-catalog]
      x-permission: products.update
      summary: Patch brand (audited).
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { name: { type: string }, slug: { type: string, nullable: true } } }
      responses: { '200': { description: Updated brand. }, '404': { description: Unknown id. } }
  /api/admin/catalog/categories:
    get:
      tags: [admin-catalog]
      x-permission: products.view
      summary: List categories.
      responses: { '200': { description: Category page. } }
    post:
      tags: [admin-catalog]
      x-permission: products.create
      summary: Create category (audited).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                slug: { type: string, nullable: true }
                parentId: { $ref: '#/components/schemas/UUID', nullable: true }
      responses: { '201': { description: Created category. }, '409': { description: Duplicate slug. } }
  /api/admin/catalog/categories/{id}:
    get:
      tags: [admin-catalog]
      x-permission: products.view
      summary: Get one category.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses: { '200': { description: Category. }, '404': { description: Unknown id. } }
    patch:
      tags: [admin-catalog]
      x-permission: products.update
      summary: Patch category incl. is_active (audited).
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses: { '200': { description: Updated category. }, '404': { description: Unknown id. } }
  /api/admin/catalog/products:
    get:
      tags: [admin-catalog]
      x-permission: products.view
      summary: List products (keyset pages; filters: search/category-subtree/brand/type/price-window/inStock; active filter explicit).
      responses: { '200': { description: Product page. } }
    post:
      tags: [admin-catalog]
      x-permission: products.create
      summary: Create product (weight shape enforced; audited).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, categoryId, productType, unit]
              properties:
                name: { type: string }
                categoryId: { $ref: '#/components/schemas/UUID' }
                brandId: { $ref: '#/components/schemas/UUID', nullable: true }
                productType: { type: string, enum: [PIECE, WEIGHT] }
                unit: { type: string, enum: [PIECE, KG, GRAM] }
      responses:
        '201': { description: Created product. }
        '422': { description: Weight-shape violation. }
  /api/admin/catalog/products/{id}:
    get:
      tags: [admin-catalog]
      x-permission: products.view
      summary: Get one product.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses: { '200': { description: Product. }, '404': { description: Unknown id. } }
    patch:
      tags: [admin-catalog]
      x-permission: products.update
      summary: Patch product (audited).
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses: { '200': { description: Updated product. }, '404': { description: Unknown id. } }
  /api/admin/catalog/products/{id}/variants:
    get:
      tags: [admin-catalog]
      x-permission: products.view
      summary: List a product's variants.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses: { '200': { description: Variant list. } }
  /api/admin/catalog/products/{id}/images:
    get:
      tags: [admin-catalog]
      x-permission: products.view
      summary: List a product's media rows (gallery shape).
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses: { '200': { description: '{ data: { primary, gallery } }.' }, '404': { description: Unknown product. } }
    post:
      tags: [admin-catalog]
      x-permission: products.update
