      parameters: [{ $ref: '#/components/parameters/IdPath' }, { name: permissionId, in: path, required: true, schema: { $ref: '#/components/schemas/UUID' } }]
      responses:
        '200': { description: '{ data: { removed: true } }'. }
        '403': { description: SUPER_ADMIN grant protection. }
        '404': { description: Unknown mapping. }
  /api/admin/permissions:
    get:
      tags: [admin-permissions]
      x-permission: roles.view
      summary: List the 31-key registry (read-only).
      responses: { '200': { description: Permission list. } }
  /api/admin/permissions/{id}:
    get:
      tags: [admin-permissions]
      x-permission: roles.view
      summary: Get one permission.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses: { '200': { description: Permission. }, '404': { description: Unknown id. } }
  /api/admin/settings:
    get:
      tags: [admin-settings]
      x-permission: settings.view
      summary: List store settings.
      responses: { '200': { description: Setting list. } }
  /api/admin/settings/{key}:
    get:
      tags: [admin-settings]
      x-permission: settings.view
      summary: Get one setting.
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      responses: { '200': { description: Setting. }, '404': { description: Unknown key. } }
    patch:
      tags: [admin-settings]
      x-permission: settings.manage
      summary: Set value (DB-typed CHECK mirrors; audited).
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: string, maxLength: 4000 }
      responses:
        '200': { description: Updated setting. }
        '404': { description: Unknown key. }
        '422': { description: Type violation. }
  /api/admin/audit-logs:
    get:
      tags: [admin-audit]
      x-permission: audit_logs.view
      summary: Query the append-only audit trail (filters + cursor paging; immutable).
      responses: { '200': { description: Audit page. } }
  /api/admin/audit-logs/{id}:
    get:
      tags: [admin-audit]
      x-permission: audit_logs.view
      summary: Get one audit row.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses: { '200': { description: Audit row. }, '404': { description: Unknown id. } }
  /api/admin/session:
    post:
      tags: [admin-session]
      summary: Login (same-origin enforced; rate buckets + lockout; generic 401; sets HttpOnly cookie; 201 + admin identity).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, minLength: 1, maxLength: 160 }
                password: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '201': { description: '{ data: { admin: { name, email } } } + Set-Cookie.' }
        '400': { description: Malformed body. }
        '401': { description: Generic failure (unknown/inactive/locked/bad password indistinguishable). }
        '403': { description: Cross-origin credential submission. }
    get:
      tags: [admin-session]
      summary: Inspect current session (identity + roles + effective permissions).
      responses:
        '200': { description: '{ data: { admin, roles, permissions } }'. }
        '401': { description: No/invalid/expired/revoked session. }
    delete:
      tags: [admin-session]
      summary: Logout (revoke server-side + clear cookie; idempotent).
      responses:
        '200': { description: '{ data: { revoked: true } }'. }
